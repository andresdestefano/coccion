<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3a4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cocción Hammurabier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2127;--mut:#68737d;--line:#dde2e8;--pri:#1b3a4b;--pri2:#2f5f78;--ok:#1e8e5a;--okbg:#e6f6ee;--warn:#b7791f;--warnbg:#fff6e5;--bad:#c0392b;--badbg:#fdecea;--crit:#8e2b1e}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri2)}
textarea{min-height:64px;resize:vertical}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px}
header button:active{background:rgba(255,255,255,.3)}
#estado{font-size:12px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap}
#estado.off{background:var(--warn)}
#estado.pend{background:var(--warn)}
#estado.err{background:var(--bad)}
main{max-width:860px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#e9edf1;color:var(--mut);font-weight:600}
.tag.ab{background:var(--okbg);color:var(--ok)}
.tag.ce{background:#e9edf1;color:var(--mut)}
/* lista de lotes */
.lote-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer}
.lote-item:active{background:#f0f3f6}
.lote-item .n{font-weight:700}
/* formulario */
.form{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.form{grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:600}
.field .hint{font-size:12px;color:var(--mut);margin-top:3px}
.req label::after{content:" *";color:var(--bad)}
/* checklist */
.prog{height:8px;background:#e3e8ee;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok);width:0}
.sec{margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.sec>h2{margin:0;padding:12px 14px;font-size:15px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;background:#f8fafc}
.sec>h2 .cnt{margin-left:auto;font-size:13px;color:var(--mut);font-weight:500}
.sec>h2 .chev{transition:transform .15s}
.sec.open>h2 .chev{transform:rotate(90deg)}
.sec.done>h2{background:var(--okbg)}
.sec .body{display:none}
.sec.open .body{display:block}
.paso{padding:12px 14px;border-top:1px solid var(--line)}
.paso.done{background:#f6fbf8}
.paso.crit{border-left:4px solid var(--crit)}
.paso .top{display:flex;gap:10px;align-items:flex-start}
.paso .id{font-weight:700;color:var(--pri2);font-variant-numeric:tabular-nums;min-width:58px}
.paso .txt{flex:1}
.paso.done .txt{color:#3d4852}
.paso .h{margin-top:6px;font-size:13px;color:var(--pri2);background:#eef4f8;padding:6px 8px;border-radius:8px}
.paso .campos{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
@media(min-width:520px){.paso .campos{grid-template-columns:1fr 1fr}}
.paso .campos label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
.paso .acc{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.paso .meta{font-size:13px;color:var(--ok);font-weight:600}
.paso .meta.pend{color:var(--warn)}
.btn.ico{width:46px;height:46px;padding:0;font-size:22px;line-height:46px;text-align:center;border-radius:12px}
.btn.omitb{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.undo{background:#fff;color:var(--mut);border:1px solid var(--line);width:38px;height:38px;font-size:18px;line-height:38px}
.paso.omit{background:#fbf5f4}
.paso.omit .txt{text-decoration:line-through;color:var(--mut)}
.paso .meta.omit{color:var(--bad)}
.secnota{padding:10px 14px;border-top:1px solid var(--line);background:#f8fafc}
.secnota label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
.secnota textarea{min-height:48px}
.paso .vals{margin-top:6px;font-size:14px;color:#2e3a45}
.paso .vals b{font-weight:600}
.resumen{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.resumen div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.resumen small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.resumen span{font-weight:700;font-size:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw}
.toast.bad{background:var(--bad)}
.ia{background:#fff6d6!important;border-color:#e0b93a!important}
.hidden{display:none!important}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;z-index:15}
.foot .btn{flex:1;max-width:280px}
</style>
</head>
<body>
<header>
  <button id="btnBack" class="hidden" onclick="irLista()">‹ Lotes</button>
  <h1 id="titulo">Cocción Hammurabier</h1>
  <span id="estado">·</span>
  <button id="btnSync" onclick="sincronizar(true)" title="Sincronizar">↻</button>
</header>
<main>
  <!-- LISTA -->
  <section id="vLista">
    <div class="row" style="margin-bottom:10px">
      <div class="grow"><span class="mut">Operador:</span> <b id="opNombre">—</b> <button class="btn sm sec" onclick="pedirOperador(true)">cambiar</button></div>
      <button class="btn" onclick="irNuevo()">+ Nuevo lote</button>
    </div>
    <div id="opForm" class="card hidden"><div class="row"><input id="opInput" class="grow" type="text" placeholder="Nombre del operador" style="width:auto"><button class="btn" onclick="guardarOperador()">Guardar</button></div></div>
    <div id="listaLotes"></div>
    <p class="mut hidden" id="listaVacia">Sin lotes. Creá el primero.</p>
    <p class="mut" style="font-size:12px;margin-top:20px">Procedimiento <span id="procVer"></span> · App <span id="appVer"></span></p>
  </section>
  <!-- NUEVO / EDITAR LOTE -->
  <section id="vNuevo" class="hidden">
    <div class="card">
      <h2 style="margin:0 0 10px;font-size:17px" id="nuevoTit">Nuevo lote</h2>
      <div class="row" style="margin-bottom:12px"><label class="btn sec sm" for="docxInput">Importar receta (.docx)</label><input id="docxInput" type="file" accept=".docx" style="display:none" onchange="importarDocx(this)"><button class="btn sec sm hidden" id="btnIA" onclick="completarIA()">Completar con IA</button><span class="mut" id="importInfo"></span></div>
      <div class="form" id="formReceta"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn" onclick="guardarLote()">Guardar lote</button>
        <button class="btn sec" onclick="cancelarNuevo()">Cancelar</button>
      </div>
    </div>
  </section>
  <!-- LOTE / CHECKLIST -->
  <section id="vLote" class="hidden">
    <div class="card" id="loteCab"></div>
    <div class="card"><h3 style="margin:0 0 8px;font-size:14px;color:var(--mut)">DATOS CLAVE</h3><div class="resumen" id="resumen"></div></div>
    <div id="secciones"></div>
    <div class="card">
      <div class="row">
        <button class="btn sec" onclick="editarReceta()">Editar receta</button>
        <button class="btn sec" onclick="verReceta()">Ver receta</button>
        <button class="btn warn" id="btnCerrar" onclick="cerrarLote()">Cerrar lote</button>
      </div>
    </div>
  </section>
</main>
<script>
// ===== PASOS — Procedimiento General de Cocción Hammurabier v4 (2026-09-03) =====
// Cada paso: id, s (sección), t (texto), c (campos de datos, opcional), h (hint con {{clave_receta}}, opcional), k (crítico)
// Tipos de campo: num, txt, sel (op: opciones), hora
var PROC_VERSION = 'v4 · 2026-09-03';
var SECCIONES = [
  { id:'1',    n:'1. Día previo' },
  { id:'2.1',  n:'2.1 Inicio del día' },
  { id:'2.2',  n:'2.2 Agua del HLT' },

  { id:'2.7',  n:'2.7 Vorlauf, sparge y recolección' },
  { id:'2.8',  n:'2.8 Hervor' },
  { id:'2.9',  n:'2.9 Whirlpool y decantación' },
  { id:'2.10', n:'2.10 Transferencia al fermentador' },
  { id:'2.11', n:'2.11 Limpieza' }
];
var PASOS = [
  // ---------- 1. Día previo ----------
  { id:'1.1', s:'1', t:'Verificar en fábrica maltas, lúpulos, levaduras, sales, enzimas y demás ingredientes.' },

  { id:'1.3', s:'1', t:'Llevar el HLT a la temperatura de maceración sin sobrecalentar. F15 y F16 abiertas, bomba HLT 50 Hz en recirculación. Confirmar que llegó antes de cerrar el día.',
    h:'T° mash receta: {{t_mash}} °C', c:[{k:'t_hlt', l:'T° HLT al cierre (°C)', t:'num'}] },
  { id:'1.4', s:'1', t:'Cargar el CLT y enfriarlo durante la noche hasta la temperatura del día: 12 °C ales / 8 °C lagers (o la de la receta). No se baja en la mañana. 1600 L para 1000–1200 L ADH; 1200 L para 800 L ADH.',
    h:'Target CLT: {{t_clt}} °C · Volumen: {{vol_clt}} L', c:[{k:'vol_clt', l:'Volumen CLT (L)', t:'num'},{k:'t_clt_set', l:'Setpoint CLT (°C)', t:'num'}] },
  { id:'1.5', s:'1', t:'Verificar detergentes y desinfectantes.' },

  { id:'2.2.1', s:'2.2', t:'Abrir válvulas F15 y F16.' },

  { id:'2.5.7', s:'2.5', t:'Mantener el agua de precalentamiento 10 min y drenar por F06.' },
  { id:'2.5.8', s:'2.5', t:'Preparar el ácido fosfórico de la fracción de maceración según receta, diluido en 3 L de agua de proceso.', h:'Fosfórico mash: {{fosforico_mash}}', c:[{k:'ml', l:'Fosfórico mash (mL)', t:'num'}] },

var API_URL = 'https://script.google.com/macros/s/AKfycbwplaw64-4SfAZmEcrMEDcY7a_1vRzItvPx_xEOJgtTJgfNNRByVsK_plwg5R-D-x4b/exec';

// ---------- utilidades ----------
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function lsGet(k,def){ try{ var v=localStorage.getItem(k); return v==null?def:JSON.parse(v);}catch(e){return def;} }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function ahoraISO(){ return new Date().toISOString(); }
function hhmm(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function fechaCorta(s){ if(!s) return ''; var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m? m[3]+'/'+m[2]+'/'+m[1] : s; }
function uid_(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function num(v){ var n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; }
function fmt(n,d){ return n==null?'—':(Math.round(n*Math.pow(10,d||0))/Math.pow(10,d||0)).toString(); }
function minutosEntre(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/60000); }
var toastT;
function toast(msg,bad){ var t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=msg; t.className='toast'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(function(){t.remove();},bad?5000:2500); }
function setEstado(){ var e=$('estado'); var cola=colaTotal(); if(!estado.online){e.textContent='sin conexión'+(cola?' · '+cola+' pend.':'');e.className='off';} else if(estado.sync){e.textContent='sincronizando…';e.className='';} else if(cola){e.textContent=cola+' pendiente'+(cola>1?'s':'');e.className='pend';} else {e.textContent='al día';e.className='';} }

// ---------- API ----------
function api(fn,datos){
  var url=API_URL+'?api='+encodeURIComponent(fn)+'&datos='+encodeURIComponent(JSON.stringify(datos||{}))+'&_='+Date.now();
  var ctrl=('AbortController' in window)?new AbortController():null;
  var to=ctrl?setTimeout(function(){ctrl.abort();},40000):null;
  return fetch(url,{method:'GET',redirect:'follow',cache:'no-store',signal:ctrl?ctrl.signal:undefined}).then(function(r){return r.json();}).then(function(j){ if(to) clearTimeout(to); if(!j||j.ok!==true) throw new Error(j&&j.error||'respuesta inválida'); return j; }).catch(function(e){ if(to) clearTimeout(to); throw e; });
}

function apiPost(fn,datos,ms){ // POST text/plain (sin preflight) para payloads grandes; Apps Script redirige y fetch sigue
  var ctrl=('AbortController' in window)?new AbortController():null; var to=ctrl?setTimeout(function(){ctrl.abort();},ms||90000):null;
  return fetch(API_URL,{method:'POST',redirect:'follow',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({api:fn,datos:datos||{}}),signal:ctrl?ctrl.signal:undefined}).then(function(r){return r.json();}).then(function(j){ if(to) clearTimeout(to); if(!j||j.ok!==true) throw new Error(j&&j.error||'respuesta inválida'); return j; }).catch(function(e){ if(to) clearTimeout(to); throw e; });
}
// ---------- operador ----------
function operador(){ return lsGet(LS.op,''); }
function pedirOperador(forzar){ var cur=operador(); if(cur&&!forzar){ $('opNombre').textContent=cur; return cur; } var n=null; try{ n=prompt('Nombre del operador:',cur||''); }catch(e){ n=null; $('opForm').classList.remove('hidden'); $('opInput').value=cur||''; if(estado.vista!=='lista') mostrar('lista'); } if(n&&n.trim()){ lsSet(LS.op,n.trim()); } $('opNombre').textContent=operador()||'—'; return operador(); }
function guardarOperador(){ var v=$('opInput').value.trim(); if(!v){ toast('Escribí el nombre',true); return; } lsSet(LS.op,v); $('opForm').classList.add('hidden'); $('opNombre').textContent=v; }

// ---------- cola offline ----------
function colaGet(){ return lsGet(LS.cola,{}); }
function colaSet(c){ lsSet(LS.cola,c); setEstado(); }
function colaTotal(){ var c=colaGet(),n=0; for(var k in c){ if(c[k].eventos) n+=c[k].eventos.length; if(c[k].crear) n++; if(c[k].receta) n++; if(c[k].estado) n++; } return n; }
function encolar(id,tipo,obj){ var c=colaGet(); c[id]=c[id]||{eventos:[]}; if(tipo==='evento') c[id].eventos.push(obj); else c[id][tipo]=obj; colaSet(c); }

function sincronizar(manual){
  if(estado.sync){ return Promise.resolve(); }
  if(!estado.online){ if(manual) toast('Sin conexión: se guardó en el dispositivo',true); return Promise.resolve(); }
  var c=colaGet(); var ids=Object.keys(c); if(!ids.length){ if(manual) return refrescar(true); return Promise.resolve(); }
  estado.sync=true; setEstado();
  var p=Promise.resolve();
  ids.forEach(function(id){
    p=p.then(function(){
      var it=colaGet()[id]; if(!it) return;
      var q=Promise.resolve();
      if(it.crear){ q=q.then(function(){ return api('loteCrear',{id:id,receta:it.crear}).then(function(){ var cc=colaGet(); if(cc[id]) delete cc[id].crear; colaSet(cc); }); }); }
      if(it.receta){ q=q.then(function(){ return api('loteEditar',{id:id,receta:it.receta}).then(function(){ var cc=colaGet(); if(cc[id]) delete cc[id].receta; colaSet(cc); }); }); }
      if(it.eventos&&it.eventos.length){ q=q.then(function(){ var evs=colaGet()[id].eventos.slice(); return api('pasoLote',{id:id,eventos:evs}).then(function(){ var loc=loteLocal(id); if(loc){ var have={}; loc.registros.forEach(function(r){have[r.uid]=1;}); evs.forEach(function(e){ if(!have[e.uid]) loc.registros.push(e); }); guardarLoteLocal(id,loc.lote,loc.registros); } var cc=colaGet(); if(cc[id]){ var enviados={}; evs.forEach(function(e){enviados[e.uid]=1;}); cc[id].eventos=cc[id].eventos.filter(function(e){return !enviados[e.uid];}); } colaSet(cc); }); }); }
      if(it.estado){ q=q.then(function(){ return api('loteEstado',{id:id,estado:it.estado}).then(function(){ var cc=colaGet(); if(cc[id]) delete cc[id].estado; colaSet(cc); }); }); }
      return q.then(function(){ var cc=colaGet(); if(cc[id]&&!cc[id].crear&&!cc[id].receta&&!cc[id].estado&&!(cc[id].eventos&&cc[id].eventos.length)) { delete cc[id]; colaSet(cc); } });
    });
  });
  return p.then(function(){ estado.sync=false; setEstado(); return refrescar(false); }).catch(function(e){ estado.sync=false; setEstado(); toast('Sincronización: '+e.message,true); });
}

// ---------- datos locales ----------
function loteLocal(id){ return lsGet(LS.lote+id,null); }
function guardarLoteLocal(id,lote,registros){ lsSet(LS.lote+id,{lote:lote,registros:registros||[],at:ahoraISO()}); }
function registrosEfectivos(id){ // servidor + cola local (la cola gana por ser más nueva)
  var loc=loteLocal(id); var regs=(loc&&loc.registros||[]).slice(); var c=colaGet()[id]; if(c&&c.eventos) regs=regs.concat(c.eventos.map(function(e){ var o={}; for(var k in e) o[k]=e[k]; o._pend=1; return o; })); return regs;
}
function estadoPasos(regs){ var m={}; regs.forEach(function(r){ var cur=m[r.paso]; if(!cur||r.ts>=cur.ts) m[r.paso]=r; }); return m; }
function omitido(st){ return !!(st&&!st.hecho&&st.valores&&st.valores._omitido); }
function resuelto(st){ return !!(st&&(st.hecho||omitido(st))); }

function refrescar(mostrar){ // trae del servidor lo que corresponde a la vista actual
  if(!estado.online) return Promise.resolve();
  if(estado.vista==='lista'){ return api('lotes',{}).then(function(j){ lsSet(LS.lotes,j.lotes); renderLista(); }).catch(function(e){ if(mostrar) toast('No se pudo cargar: '+e.message,true); }); }
  if(estado.vista==='lote'&&estado.loteId){ var id=estado.loteId; var cc=colaGet()[id]; if(cc&&cc.crear) return Promise.resolve(); return api('loteGet',{id:id}).then(function(j){ if(!j.lote||!j.lote.id) throw new Error('lote no encontrado'); guardarLoteLocal(id,j.lote,j.registros); if(estado.loteId===id){ estado.lote=j.lote; renderLote(false); } }).catch(function(e){ if(mostrar) toast('No se pudo cargar: '+e.message,true); }); }
  return Promise.resolve();
}

// ---------- navegación ----------
function mostrar(v){ estado.vista=v; ['vLista','vNuevo','vLote'].forEach(function(x){ $(x).classList.add('hidden'); }); $({lista:'vLista',nuevo:'vNuevo',lote:'vLote'}[v]).classList.remove('hidden'); $('btnBack').classList.toggle('hidden',v==='lista'); window.scrollTo(0,0); }
function irLista(){ estado.loteId=null; estado.lote=null; mostrar('lista'); $('titulo').textContent='Cocción Hammurabier'; renderLista(); refrescar(false); }
function irNuevo(){ estado.editandoId=null; $('nuevoTit').textContent='Nuevo lote'; renderForm({fecha:new Date().toISOString().slice(0,10),operador:operador()}); mostrar('nuevo'); $('titulo').textContent='Nuevo lote'; }
function cancelarNuevo(){ if(estado.editandoId) abrirLote(estado.editandoId); else irLista(); }
function abrirLote(id){ estado.loteId=id; var loc=loteLocal(id); estado.lote=loc?loc.lote:null; mostrar('lote'); if(!estado.lote){ $('loteCab').innerHTML='<span class="mut">Cargando…</span>'; $('secciones').innerHTML=''; $('resumen').innerHTML=''; } else renderLote(true); refrescar(true); }

// ---------- lista ----------
function renderLista(){
  var lotes=lsGet(LS.lotes,[]); var c=colaGet();

// Lee el Word en el navegador (JSZip + DOMParser) y mapea las tablas de la plantilla "Receta de Producción" a los campos de receta.
function docxBloques(buf){ // → [{t:'p',txt}|{t:'tbl',rows:[[celda,...]]}] en orden de documento
  return JSZip.loadAsync(buf).then(function(z){ var f=z.file('word/document.xml'); if(!f) throw new Error('no es un .docx'); return f.async('string'); }).then(function(xml){
    var doc=new DOMParser().parseFromString(xml,'application/xml');
    var body=null; var all=doc.getElementsByTagName('*'); for(var i=0;i<all.length;i++){ if(all[i].localName==='body'){ body=all[i]; break; } }
    if(!body) throw new Error('documento vacío');
    function texto(el){ var out=''; var ns=el.getElementsByTagName('*'); for(var i=0;i<ns.length;i++){ var n=ns[i]; if(n.localName==='t') out+=n.textContent; else if(n.localName==='tab') out+=' '; else if(n.localName==='br') out+='\n'; } return out.replace(/ /g,' ').replace(/[ \t]+/g,' ').trim(); }
    var bl=[]; var ch=body.childNodes;
    for(var j=0;j<ch.length;j++){ var c=ch[j]; if(c.nodeType!==1) continue;
      if(c.localName==='p'){ var t=texto(c); if(t) bl.push({t:'p',txt:t}); }
      else if(c.localName==='tbl'){ var rows=[]; var trs=c.childNodes; for(var r=0;r<trs.length;r++){ var tr=trs[r]; if(tr.nodeType!==1||tr.localName!=='tr') continue; var cells=[]; var tcs=tr.childNodes; for(var k=0;k<tcs.length;k++){ var tc=tcs[k]; if(tc.nodeType!==1||tc.localName!=='tc') continue; cells.push(texto(tc)); } if(cells.some(function(x){return x;})) rows.push(cells); } if(rows.length) bl.push({t:'tbl',rows:rows}); }
    }
    return bl;
  });
}
function numDe(s){ if(s==null) return null; var t=String(s).replace(/(\d),(?=\d{3}\b)/g,'$1'); var m=/-?\d+(?:[.,]\d+)?/.exec(t); return m?parseFloat(m[0].replace(',','.')):null; }

  set('vol_pre',numDe(celda(/recoleccion pre-?hervor|volumen pre-?hervor/)));
  // --- grist
  var tg=tablaCon(/malta/); if(tg){ var kgTot=null; var lineas=[]; tg.rows.slice(1).forEach(function(row){ var n=norm(row[0]); if(/^total/.test(n)){ kgTot=numDe(row[1]); return; } var kg=numDe(row[1]); if(row[0]&&kg!=null) lineas.push(row[0].replace(/\s*\([^)]*°?L\)/,'').trim()+' '+kg+' kg'); }); set('grist',lineas.join('; ')+(kgTot!=null?' (total '+kgTot+' kg)':'')); } else faltan.push('grist');
  // --- agua
  var aguaMash=numDe(celda(/^agua de maceracion|^maceracion$/)); if(aguaMash==null){ var fm=fila(/^maceracion/); aguaMash=fm?numDe(fm[1]):null; } set('agua_mash',aguaMash);
  var hltTrat=null; var mh=/hlt tratado:?\s*([\d.,]+)\s*l/i.exec(textoTodo); if(mh) hltTrat=numDe(mh[1]);
  if(hltTrat==null){ var ta=tablaCon(/fraccion.*volumen/); if(ta){ var tot=null,enj=null; ta.rows.forEach(function(row){ var n=norm(row[0]); if(/^total/.test(n)) tot=numDe(row[1]); if(/enjuague/.test(n)) enj=numDe(row[1]); }); if(tot!=null) hltTrat=tot-(enj||0); } }
  set('agua_total',hltTrat);
  // --- maceración
  set('t_mash',numDe(celda(/temperatura de maceracion/)));
  set('t_mac',numDe(celda(/tiempo de sacarificacion|tiempo de maceracion/)));
  set('ph_mash',numDe(celda(/ph maceracion|ph de maceracion|ph mash/)));
  // --- adiciones al agua
  var tw=tablaCon(/adicion.*cantidad.*fraccion/); var sales=[]; if(tw){ tw.rows.slice(1).forEach(function(row){ var n=norm(row[0]); var cant=row[1]||''; var frac=norm(row[2]||'');
      if(/ascorbic/.test(n)) r.ascorbico=cant;
      else if(/fosforic/.test(n)){ if(/macer/.test(frac)) r.fosforico_mash=cant; else if(/sparge|lavado/.test(frac)) r.fosforico_sparge=cant; }
      else if(/sulfato|cloruro|sal|carbonato|magnesio|calcio|sodio/.test(n)){ var mq=/\(([^)]+)\)/.exec(row[0]); sales.push((mq?mq[1]:row[0])+' '+cant); } }); }
  set('sales',sales.join('; ')); ['ascorbico','fosforico_mash','fosforico_sparge'].forEach(function(k){ if(!r[k]) faltan.push(k); });
  // --- hervor
  var th=null; for(var h=0;h<parrafos.length;h++){ var mhv=/hervor\s*[—–-]+\s*(\d+)\s*min/i.exec(parrafos[h]); if(mhv){ th=parseInt(mhv[1],10); break; } }
  if(th==null){ th=numDe(celda(/tiempo de hervor|duracion del hervor|hervor/)); } set('t_hervor',th);
  var tb=tablaCon(/producto.*cantidad.*min/); if(tb){ var hdr=tb.rows[0].map(norm); var iProd=hdr.findIndex(function(x){return /producto/.test(x);}); var iCant=hdr.findIndex(function(x){return /cantidad/.test(x);}); var iFal=hdr.findIndex(function(x){return /faltan/.test(x);}); var iIni=hdr.findIndex(function(x){return /inicio/.test(x);});
    var ads=tb.rows.slice(1).map(function(row){ var fal=iFal>=0?numDe(row[iFal]):null; var ini=iIni>=0?numDe(row[iIni]):null; var etiqueta=fal!=null?('faltan '+fal+' min'):(ini!=null?('min '+ini):''); var flame=/flameout/i.test(row[iIni]||'')||fal===0; return (etiqueta?etiqueta+(flame?' (flameout)':'')+': ':'')+(row[iProd]||row[0])+' — '+(row[iCant]||''); }); set('adiciones',ads.join('\n')); } else faltan.push('adiciones');
  // --- inoculación
  var ti=tablaCon(/adicion.*cantidad.*momento/); if(ti){ var lev=[],otras=[]; ti.rows.slice(1).forEach(function(row){ var n=norm(row[0]); if(/saflager|safale|levadura|yeast|lallemand|fermentis.*(w-?34|s-?23|us-?05|k-?97|s-?04|t-?58)|w-?34\/70|34\/70/.test(n)&&!/springferm|clearzyme|nutrient/.test(n)) lev.push(row[0]+' '+(row[1]||'')); else otras.push(row[0]+' '+(row[1]||'')); }); set('levadura',lev.join('; ')); set('adiciones_fv',otras.join('; ')); } else { faltan.push('levadura'); faltan.push('adiciones_fv'); }
  // --- fermentación
  var tf=tablaCon(/fase.*t\s*°?c/); var tferm=null; if(tf){ var fko=tf.rows.slice(1).filter(function(row){return /knock|inocul|pitch|dia 0/.test(norm(row[0]+' '+row[2]));})[0]||tf.rows[1]; if(fko) tferm=numDe(fko[1]); } if(tferm==null) tferm=numDe(celda(/temperatura de fermentacion|knock ?out/)); set('t_ferm',tferm);
  // --- oxigenación / molienda / CLT (si el documento los trae)
  var mo=/oxigenaci[oó]n[^\n|]*[|:]?\s*([^\n|]*)/i.exec(textoTodo); if(mo){ r.o2=/\bno\b|sin /i.test(mo[1])?'No':'Sí'; }
  var mm=celda(/molienda|separacion de rodillos/); if(mm) r.molienda=mm;
  var mc=numDe(celda(/temperatura (del )?clt|clt/)); if(mc!=null) r.t_clt=mc;
  // --- notas: datos útiles que no tienen campo
  var notas=['Importado de '+(nombreArchivo||'.docx')];
  var tsp=celda(/temperatura de sparge/); if(tsp) notas.push('Sparge '+tsp);
  var phsp=celda(/ph agua de sparge|ph sparge/); if(phsp) notas.push('pH sparge '+phsp+' @20 °C');
  var corte1=celda(/corte por ph/); var corte2=celda(/corte por gravedad/); if(corte1||corte2) notas.push('Corte: '+[corte1,corte2].filter(Boolean).join(' / '));
  var sh=/set hlt\S*:?\s*([\d.,]+\s*°?c)/i.exec(textoTodo); if(sh) notas.push('Set HLT '+sh[1]);
  var wp=/whirlpool:?\s*([^\n]*)/i.exec(textoTodo); if(wp) notas.push('Whirlpool: '+wp[1].trim());
  var fv=celda(/fermentador|tanque/); if(fv&&fv.length<20) r.fv=fv;
  r.notas=notas.join(' · ');
  return {receta:r,faltan:faltan};
}
var importEstado={texto:'',nDoc:0,faltan:[]};
function bloquesATexto(bl){ return bl.map(function(b){ return b.t==='p'?b.txt:b.rows.map(function(x){return x.join(' | ');}).join('\n'); }).join('\n'); }
function marcarIA(k){ var el=$('rc_'+k); if(!el) return; el.classList.add('ia'); el.title='Valor propuesto por IA: revisar'; el.addEventListener('input',function(){ el.classList.remove('ia'); el.title=''; },{once:true}); }
function infoImport(nIA){ var etiquetas=RECETA_CAMPOS.filter(function(c){return importEstado.faltan.indexOf(c.k)>=0;}).map(function(c){return c.l;}); $('importInfo').textContent=importEstado.nDoc+' campos del documento'+(nIA?' · '+nIA+' por IA (amarillo: revisar)':'')+(etiquetas.length?' · sin dato: '+etiquetas.join(', '):''); }
function importarDocx(input){
  var f=input.files&&input.files[0]; if(!f) return; if(typeof JSZip==='undefined'){ toast('Importador no disponible sin conexión',true); return; }
  $('importInfo').textContent='Leyendo…'; $('btnIA').classList.add('hidden');
  f.arrayBuffer().then(docxBloques).then(function(bl){ var res=recetaDesdeBloques(bl,f.name); var actual=leerForm().receta; var r={}; for(var k in actual) r[k]=actual[k]; for(var k2 in res.receta) r[k2]=res.receta[k2]; if(!r.fecha) r.fecha=new Date().toISOString().slice(0,10); if(!r.operador) r.operador=operador(); renderForm(r);
    importEstado={texto:bloquesATexto(bl),nDoc:Object.keys(res.receta).length,faltan:res.faltan}; infoImport(0); $('btnIA').classList.remove('hidden'); window.scrollTo(0,0);
    var faltaReq=RECETA_CAMPOS.some(function(c){ return c.req&&c.k!=='fecha'&&c.k!=='operador'&&res.faltan.indexOf(c.k)>=0; });
    if((faltaReq||importEstado.nDoc<12)&&estado.online){ completarIA(); } else toast('Receta importada: revisá y guardá'); })
  .catch(function(e){ $('importInfo').textContent=''; toast('No se pudo leer el archivo: '+e.message,true); })
  .then(function(){ input.value=''; });
}
function completarIA(){
  if(!importEstado.texto){ toast('Primero importá un .docx',true); return; }
  if(!estado.online){ toast('Sin conexión: la IA necesita internet',true); return; }
  var b=$('btnIA'); b.disabled=true; b.textContent='Consultando IA…'; $('importInfo').textContent='Consultando IA (10–20 s)…';
  apiPost('recetaIA',{texto:importEstado.texto}).then(function(j){ var r=j.receta||{}; var nIA=0; var vacios=[]; RECETA_CAMPOS.forEach(function(c){ var el=$('rc_'+c.k); if(!el) return; var v=r[c.k]; if(v==null||v==='') return; if(el.value.trim()!=='') return; el.value=v; marcarIA(c.k); nIA++; }); importEstado.faltan=RECETA_CAMPOS.filter(function(c){ var el=$('rc_'+c.k); return el&&el.value.trim()===''&&c.k!=='notas'&&c.k!=='fv'&&c.k!=='t_clt'&&c.k!=='molienda'&&c.k!=='o2'; }).map(function(c){return c.k;});
    infoImport(nIA); toast(nIA?nIA+' campos completados por IA: revisá los amarillos':'La IA no agregó datos nuevos'); })
  .catch(function(e){ infoImport(0); toast('IA: '+e.message,true); })
  .then(function(){ b.disabled=false; b.textContent='Completar con IA'; });
}
